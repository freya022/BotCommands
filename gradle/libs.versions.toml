# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# Plugins
maven-publish-plugin = "0.32.0"
dokka-plugin = "2.0.0"

# Libraries
kotlin = "2.1.0"
kotlinx-coroutines = "1.10.1"

stacktrace-decoroutinator-jvm = "2.4.8"

slf4j-api = "2.0.16"
logback-classic = "1.5.16"
kotlin-logging-jvm = "7.0.3"

jda = "5.5.0"
jda-ktx = "0.12.0"

classgraph = "4.8.179"

kotlinx-datetime-jvm = "0.6.1"

jackson = "2.18.3"

kotlinx-serialization = "1.8.1"

trove4j-core = "3.1.0"

jda-emojis = "3.0.0"
jemoji = "1.6.0"

caffeine = "3.2.0"

java-string-similarity = "2.0.0"

jsr305 = "3.0.2"
jetbrains-annotations = "26.0.2"

spring-boot = "3.4.2"

h2 = "2.3.232"
postgresql = "42.7.5" # Tied to [[ComponentRepository#checkPostgresVersion]]
hikaricp = "6.2.1"
flyway = "11.2.0"

bucket4j-jdk17-core = "8.14.0"
bucket4j-jdk17-postgresql = "8.14.0"

mockk-jvm = "1.13.16"

byte-buddy = "1.16.1"
byte-buddy-agent = "1.16.1"

ksp = "2.1.21-2.0.2"

jetbrains-markdown = "0.7.3"

[plugins]
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
maven-publish-plugin = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "maven-publish-plugin" }
dokka-plugin = { module = "org.jetbrains.dokka:org.jetbrains.dokka.gradle.plugin", version.ref = "dokka-plugin" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version.ref = "kotlinx-coroutines" }

stacktrace-decoroutinator-jvm = { module = "dev.reformator.stacktracedecoroutinator:stacktrace-decoroutinator-jvm", version.ref = "stacktrace-decoroutinator-jvm" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-classic" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging-jvm" }

jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
jda-ktx = { module = "club.minnced:jda-ktx", version.ref = "jda-ktx" }

classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }

kotlinx-datetime-jvm = { module = "org.jetbrains.kotlinx:kotlinx-datetime-jvm", version.ref = "kotlinx-datetime-jvm" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

trove4j-core = { module = "net.sf.trove4j:core", version.ref = "trove4j-core" }

jda-emojis = { module = "dev.freya02:jda-emojis", version.ref = "jda-emojis" }
jemoji = { module = "net.fellbaum:jemoji", version.ref = "jemoji" }

caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

java-string-similarity = { module = "info.debatty:java-string-similarity", version.ref = "java-string-similarity" }

jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

spring-boot = { module = "org.springframework.boot:spring-boot", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }

h2 = { module = "com.h2database:h2", version.ref = "h2" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

bucket4j-jdk17-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j-jdk17-core" }
bucket4j-jdk17-postgresql = { module = "com.bucket4j:bucket4j_jdk17-postgresql", version.ref = "bucket4j-jdk17-postgresql" }

mockk-jvm = { module = "io.mockk:mockk-jvm", version.ref = "mockk-jvm" }

byte-buddy = { module = "net.bytebuddy:byte-buddy", version.ref = "byte-buddy" }
byte-buddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "byte-buddy-agent" }

ksp = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrains-markdown" }
