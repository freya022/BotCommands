# Remove the directories of other modules from the restart classpath

restart.exclude.restarter-prod=BotCommands-restarter/build/classes/(?:kotlin|java)/main
restart.exclude.restarter-prod-res=BotCommands-restarter/build/resources/main

restart.exclude.core-prod=BotCommands-core/build/classes/(?:kotlin|java)/main
restart.exclude.core-prod-res=BotCommands-core/build/resources/main

restart.exclude.spring-prod=BotCommands-spring/build/classes/(?:kotlin|java)/main
restart.exclude.spring-prod-res=BotCommands-spring/build/resources/main

restart.exclude.jda-ktx-prod=BotCommands-jda-ktx/build/classes/(?:kotlin|java)/main
restart.exclude.jda-ktx-prod-res=BotCommands-jda-ktx/build/resources/main

restart.exclude.typesafe-messages-prod=BotCommands-typesafe-messages/[\\w-]+/build/classes/(?:kotlin|java)/main
restart.exclude.typesafe-messages-prod-res=BotCommands-typesafe-messages/[\\w-]+/build/resources/main

restart.exclude.method-accessors-prod=BotCommands-method-accessors/[\\w-]+/build/classes/(?:kotlin|java)/main
restart.exclude.method-accessors-prod-res=BotCommands-method-accessors/[\\w-]+/build/resources/main

restart.exclude.jda-keepalive-prod=BotCommands-jda-keepalive/build/classes/(?:kotlin|java)/main
