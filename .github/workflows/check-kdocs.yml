name: Check compile, tests & KDocs
on:
  workflow_dispatch:
  pull_request:
    branches:
      - 3.X
  push:
    branches: 
      - 3.X

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run tests
        run: ./gradlew test

      - name: Build KDocs
        # Run even if tests failed
        if: ${{ !cancelled() }}
        run: ./gradlew dokkaGenerate

      - name: Upload JUnit XML Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: junit-xml-test-report
          path: '**/build/test-results/test'

      - name: Upload HTML Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: junit-html-test-report
          path: '**/build/reports/tests/test'

      - name: Annotate Failed Tests
        uses: mikepenz/action-junit-report@v6.0.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: 'true'
